name: Apply FCI spendable hotfix

on:
  push:
    branches: [fix/fci-spendable-navigation]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/fci-spendable-navigation
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply source hotfix
        run: node scripts/apply-fci-spendable-hotfix.mjs

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Repository hygiene
        run: npm run check:repo

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-fci-spendable-hotfix.mjs
          rm .github/workflows/apply-fci-spendable-hotfix.yml

      - name: Commit verified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix FCI spending, activity, and back navigation"
          git push origin HEAD:fix/fci-spendable-navigation
