name: Rebuild clean FCI hotfix

on:
  push:
    branches: [fix/fci-spendable-navigation]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  rebuild-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/fci-spendable-navigation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild clean source from master
        run: python3 scripts/rebuild-clean-fci-hotfix.py

      - name: Parse component source
        run: node --check src/app/component.js

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Repository hygiene
        run: npm run check:repo

      - name: Validate generated source parses
        run: node --check src/app/component.js

      - name: Remove temporary rebuild machinery
        run: |
          rm scripts/rebuild-clean-fci-hotfix.py
          rm .github/workflows/rebuild-clean-fci-hotfix.yml

      - name: Commit verified clean hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Rebuild clean FCI spending and navigation hotfix"
          git push origin HEAD:fix/fci-spendable-navigation
