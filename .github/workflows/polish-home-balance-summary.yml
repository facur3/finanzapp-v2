name: Polish home balance summary

on:
  push:
    branches: [polish/home-balance-summary]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: polish/home-balance-summary
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply UI polish
        run: node scripts/polish-home-balance-summary.mjs

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Repository hygiene
        run: npm run check:repo

      - name: Remove temporary patch machinery
        run: |
          rm scripts/polish-home-balance-summary.mjs
          rm .github/workflows/polish-home-balance-summary.yml

      - name: Commit verified polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Polish home balance summary"
          git push origin HEAD:polish/home-balance-summary
