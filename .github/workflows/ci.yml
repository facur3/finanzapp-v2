name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install root tooling (vitest, typescript)
        run: npm ci

      - name: Domain and mobile backend tests (packages/domain, server/mobile)
        run: npm test

      # The runner is in UTC, where local time equals UTC: the same tests again in an offset zone (the primary market), one
      # with daylight saving and one ahead of UTC, so a date computed from UTC instead of the device's calendar day fails here.
      - name: The same tests in Buenos Aires, New York and Auckland (the local calendar day, never UTC's)
        run: for zone in America/Argentina/Buenos_Aires America/New_York Pacific/Auckland; do TZ=$zone npm test || exit 1; done

      - name: Repository hygiene (no generated files, no legacy web tree, no imports from retired paths, no secrets)
        run: npm run check:repo

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install isolated mobile dependencies
        run: npm ci

      - name: Dependency tree integrity
        run: npm ls --all

      # Pull requests check the lockfile against the table of the Expo version it pins, so a patch Expo publishes later
      # cannot turn an unrelated PR red. Pushes to master check against Expo's live table: red there means «run
      # `npx expo install --fix` in a chore PR», never a broken change.
      - name: Expo dependency compatibility (the pinned Expo version's table)
        if: github.event_name == 'pull_request'
        env:
          EXPO_OFFLINE: '1'
        run: npm run check

      - name: Expo patch drift (Expo's live table)
        if: github.event_name != 'pull_request'
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: Currency catalogue integrity (offline, against the lock's output hashes)
        run: npm run currency:verify

      - name: Region catalogue integrity (offline, against the lock's output hashes)
        run: npm run regions:verify

      - name: Localization catalogues (keys, placeholders, plurals, generated currency names)
        run: npm run i18n:check

      - name: SQLite persistence and dependency compatibility tests
        run: npm run test:storage

      - name: The same tests in Buenos Aires, New York and Auckland (the local calendar day, never UTC's)
        run: for zone in America/Argentina/Buenos_Aires America/New_York Pacific/Auckland; do TZ=$zone npm run test:storage || exit 1; done

      - name: Export iOS JavaScript and assets (not a signed native build)
        run: npm run export:ios

      - name: The exported bundle names no server secret (provider key, Supabase secret key)
        run: node ../../scripts/check-bundle-secrets.mjs dist

  mobile_api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: mobile_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Isolated PostgreSQL inbox ownership, deduplication and quota tests
        env:
          PGPASSWORD: fixture-only
        run: psql -h localhost -U postgres -d mobile_api_test -f server/mobile/schema.test.sql
      - name: The owner's staging verification and usage report run clean on the same schema (no remote project)
        env:
          PGPASSWORD: fixture-only
        run: |
          psql -h localhost -U postgres -d mobile_api_test -v ON_ERROR_STOP=1 -tA -f server/mobile/staging/verify.sql | grep -qx STAGING_VERIFY_OK
          psql -h localhost -U postgres -d mobile_api_test -v ON_ERROR_STOP=1 -tA -f server/mobile/staging/usage-report.sql | grep -q '"kind": "finanzapp.ai-usage.v1"'
