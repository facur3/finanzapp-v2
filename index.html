          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div onClick="{{ openAssistant }}" aria-label="Abrir asistente" style="width:38px;height:38px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent);">

            </div>
            <div onClick="{{ toggleTheme }}" style="width:38px;height:38px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);">
