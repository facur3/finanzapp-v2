<!-- Apple / iOS standalone: translucent status bar so the app background fills

<!-- Pure financial domain (money math, transaction apply/reverse, dates…).
     Classic + synchronous ON PURPOSE: the component boots inside
     loadReactUmd().then(init) and can render before a deferred module runs.
     Loading here (before support.js) guarantees window.FinanzDomain exists at
     first render. Generated from src/domain/ (the tested source of truth) by
     `npm run build:domain`; regenerated automatically on predev/prebuild. -->
<script src="./domain.iife.js"></script>
<script src="./capacitor-deep-links.iife.js"></script>
<script src="./support.js"></script>
<script src="./vendor/supabase.js"></script>
<script>
  // Classify display mode before first paint so safe-area CSS can stay scoped.
  (function () {
    var standalone = false;
    try {
      standalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    } catch (e) {}
    document.documentElement.classList.add(standalone ? 'fa-standalone' : 'fa-browser');
  })();
  window.FINANZAPP_VERSION = '1.2.0';
  // Safe service-worker registration: only when supported; never blocks the app.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () { /* offline shell is best-effort */ });
    });
  }
  // Keep the page/status-bar background and theme-color meta in sync with the app
  // theme so the real device safe areas match (no white strip in dark mode).
  // This is infrastructure only — it adds no visible UI.
  (function () {
    function apply(t) {
      if (t !== 'dark' && t !== 'light') return; // ignore unrendered placeholder
      var c = t === 'dark' ? '#080B10' : '#F4F7FB';
      if (document.documentElement) document.documentElement.style.background = c;
      if (document.body) document.body.style.background = c;
      var m = document.querySelector('meta[name=theme-color]');
      if (m) m.setAttribute('content', c);
    }
    var theme = 'light';
    try {
      var raw = localStorage.getItem('finanzapp:v2:state') || localStorage.getItem('finanzapp.v2.state');
      if (raw) { var p = JSON.parse(raw); var t = p && p.state && p.state.theme; if (t === 'dark' || t === 'light') theme = t; }
    } catch (e) {}
    apply(theme); // pre-paint, before the app renders
    // The hidden template may also contain a .fa-frame with an unrendered
    // placeholder data-theme; select the rendered frame (real dark/light value).
    function findFrame() {
      var els = document.querySelectorAll('.fa-frame');
      for (var i = 0; i < els.length; i++) {
        var v = els[i].getAttribute('data-theme');
        if (v === 'dark' || v === 'light') return els[i];
      }
      return null;
    }
    function watch() {
      var el = findFrame();
      if (!el) return false;
      apply(el.getAttribute('data-theme'));
      new MutationObserver(function () { apply(el.getAttribute('data-theme')); })
        .observe(el, { attributes: true, attributeFilter: ['data-theme'] });
      return true;
    }
    document.addEventListener('DOMContentLoaded', function () {
      if (watch()) return;
      var iv = setInterval(function () { if (watch()) clearInterval(iv); }, 150);
      setTimeout(function () { clearInterval(iv); }, 8000);
    });
  })();
</script>
<link rel="stylesheet" href="/finanzapp.css">
</head>
